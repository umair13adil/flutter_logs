group 'com.flutter.logs.plogs.flutter_logs'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
// Kotlin is not applied here: AGP 9 provides it when android.builtInKotlin is enabled,
// and Flutter 3.44+ applies the Kotlin Gradle plugin to plugins when it is not.

android {
    namespace 'com.flutter.logs.plogs.flutter_logs'
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 16
        consumerProguardFiles 'consumer-rules.pro'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    //RxJav2
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation  'io.reactivex.rxjava2:rxkotlin:2.2.0'

    //RxLogs
    implementation "com.github.umair13adil:RxLogs:v1.0.27"

    implementation "androidx.core:core-ktx:1.9.0"
    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:2.8.1"
}
